<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidal Sediment — shallow-water tidal prism (symmetric flood/ebb)</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#0b0e14;color:#cdd6e4;font-family:ui-monospace,Menlo,Consolas,monospace;}
  #wrap{position:relative;width:100vw;height:100vh;}
  canvas{display:block;}
  #hud{position:absolute;top:12px;left:14px;font-size:13px;line-height:1.5;pointer-events:none;}
  #hud .ph{color:#ffd166;font-weight:bold;}
  #panel{position:absolute;right:12px;top:12px;width:224px;background:rgba(20,26,36,.85);border:1px solid #2a3444;border-radius:8px;padding:12px;font-size:12px;max-height:92vh;overflow-y:auto;}
  #panel label{display:block;margin:8px 0 2px;color:#8fa2bd;}
  #panel input[type=range]{width:100%;}
  #panel .val{float:right;color:#ffd166;}
  #panel button{width:100%;margin-top:8px;padding:6px;background:#22304a;color:#cdd6e4;border:1px solid #3a4a66;border-radius:5px;cursor:pointer;font-family:inherit;}
  #panel button.on{background:#7a4a12;border-color:#ffd166;color:#fff;}
  #legend{position:absolute;right:14px;bottom:14px;font-size:11px;color:#8fa2bd;line-height:1.6;text-align:right;}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:4px;vertical-align:-1px;}
  #brush-hint{position:absolute;left:14px;bottom:14px;font-size:11px;color:#8fa2bd;line-height:1.5;}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"></div>
  <div id="panel">
    <label>TIDE AMPLITUDE <span class="val" id="vAmp"></span></label>
    <input type="range" id="sAmp" min="0.5" max="6" step="0.1" value="3">
    <label>TIDE PERIOD (frames) <span class="val" id="vPer"></span></label>
    <input type="range" id="sPer" min="120" max="1200" step="30" value="360">
    <label>ASYMMETRY (M4) <span class="val" id="vAsy"></span></label>
    <input type="range" id="sAsy" min="-0.3" max="0.3" step="0.01" value="0.12">
    <label>SETTLE RATE <span class="val" id="vSet"></span></label>
    <input type="range" id="sSet" min="0" max="0.15" step="0.005" value="0.02">
    <label>ERODE RATE <span class="val" id="vEro"></span></label>
    <input type="range" id="sEro" min="0" max="0.08" step="0.002" value="0.05">
    <button id="bMorph" class="on">MORPHOLOGY — on</button>
    <button id="bFlow" class="on">FLOW — on</button>
    <button id="bReset">RESET BED + SEDIMENT</button>
  </div>
  <div id="legend">
    accretion <span class="sw" style="background:#ffd166"></span>&nbsp; erosion <span class="sw" style="background:#4cc9f0"></span><br>
    flow <span class="sw" style="background:#7ad0f0"></span><br>
    sediment <span class="sw" style="background:#ff44aa"></span>
  </div>
  <div id="brush-hint">sea ← inlet at left · land → dead end at right · drag = carve · shift+drag = fill</div>
</div>
<script>
// ── TIDAL PRISM MODEL (analytic short-channel shallow-water limit) ──
const BED_CELL = 8, BED_MAX = 160;
const PARTICLE_COUNT = 1600, MAX_AGE = 1200;
const FLOW_SCALE = 96;          // maps d(eta)/dt to visual px/frame velocity
const NET_DRIFT = 0.5;          // net landward/seaward transport per unit asymmetry
const settleThresh = 1.5, erodeThresh = 3.5, DEPO_AMOUNT = 1.5;

let particles = [];
let simTime = 0;
let GW, GH, userBedGrid, depoGrid;
let tidalAmp = 3, tidalPeriod = 360, asym = 0.12;
let settleProb = 0.02, erodeProb = 0.05;
let showMorph = true, showFlow = true;

function smoothstep(t, e0, e1) { let x = constrain((t - e0) / (e1 - e0), 0, 1); return x * x * (3 - 2 * x); }

// water level (m relative to mean) and its time derivative
function etaLevel() { let w = 2 * Math.PI / tidalPeriod; return tidalAmp * (Math.sin(w * simTime) + asym * Math.sin(2 * w * simTime)); }
function dEtaDt()     { let w = 2 * Math.PI / tidalPeriod; return tidalAmp * w * (Math.cos(w * simTime) + 2 * asym * Math.cos(2 * w * simTime)); }

// along-channel flow: +x = landward (flood), -x = seaward (ebb).
// zero at the landward end (dead-end), max at the sea inlet; concentrated in the channel.
function flowAt(x, y) {
  let landward = (width - x) / width;            // 1 at sea (left) -> 0 at land (right)
  let t = Math.abs(y / height - 0.5) * 2;        // 0 channel centre, 1 marsh edge
  let chanF = 1 - 0.75 * smoothstep(t, 0.3, 0.72); // 1 in channel, 0.25 on marsh
  // oscillating tidal flow + a net transport proportional to the flood/ebb asymmetry (tidal pumping)
  return dEtaDt() * landward * chanF * FLOW_SCALE + asym * NET_DRIFT * chanF;
}

// ---- bed ----
function userBedAt(x, y) {
  let gx = x / BED_CELL, gy = y / BED_CELL;
  let x0 = constrain(floor(gx), 0, GW-1), y0 = constrain(floor(gy), 0, GH-1);
  let x1 = min(x0+1, GW-1), y1 = min(y0+1, GH-1);
  let fx = gx - x0, fy = gy - y0;
  return userBedGrid[x0+y0*GW]*(1-fx)*(1-fy) + userBedGrid[x1+y0*GW]*fx*(1-fy) + userBedGrid[x0+y1*GW]*(1-fx)*fy + userBedGrid[x1+y1*GW]*fx*fy;
}
function depoAt(x, y) {
  let gx = x / BED_CELL, gy = y / BED_CELL;
  let x0 = constrain(floor(gx), 0, GW-1), y0 = constrain(floor(gy), 0, GH-1);
  let x1 = min(x0+1, GW-1), y1 = min(y0+1, GH-1);
  let fx = gx - x0, fy = gy - y0;
  return depoGrid[x0+y0*GW]*(1-fx)*(1-fy) + depoGrid[x1+y0*GW]*fx*(1-fy) + depoGrid[x0+y1*GW]*(1-fx)*fy + depoGrid[x1+y1*GW]*fx*fy;
}
function bedZ(x, y) { return userBedAt(x, y) + depoAt(x, y); }
function addDeposit(x, y, amt) {
  let gx = floor(x / BED_CELL), gy = floor(y / BED_CELL);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    let nx = gx + dx, ny = gy + dy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    let w = (dx === 0 && dy === 0) ? 0.5 : 0.0625;
    depoGrid[nx + ny * GW] = constrain(depoGrid[nx + ny * GW] + amt * w, -BED_MAX, BED_MAX);
  }
}
function defaultBed() {
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    let y = (gy * BED_CELL) / height;
    let t = Math.abs(y - 0.5) * 2;
    let marsh = 130, channel = 40;
    let z = marsh - (marsh - channel) * (1 - smoothstep(t, 0.35, 0.78));
    userBedGrid[gx + gy * GW] = constrain(z, 5, BED_MAX);
  }
}

function spawnParticle() {
  return { x: random(0, width), y: random(cellH, height - cellH), vx: 0, vy: 0, born: simTime - random(0, MAX_AGE) };
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    let velVx = flowAt(p.x, p.y);
    p.vx += (velVx - p.vx) * 0.35;
    p.vy += (0 - p.vy) * 0.05;
    let spd = Math.abs(velVx);
    p.vx += (noise(p.x*0.02, p.y*0.02, simTime*0.05) - 0.5) * 0.14 * spd;
    p.vy += (noise(p.x*0.02+50, p.y*0.02, simTime*0.05) - 0.5) * 0.14 * spd;

    // gravity slide down the bed (toward deeper channel)
    let gradY = (bedZ(p.x, p.y - 4) - bedZ(p.x, p.y + 4)) / 8;
    let gradX = (bedZ(p.x - 4, p.y) - bedZ(p.x + 4, p.y)) / 8;
    p.vy += gradY * cellH * 1.4;
    p.vx += gradX * cellW * 0.4;

    p.x += p.vx * 0.4;
    p.y += p.vy * 0.4;

    // deposition at slack, erosion at peak flow
    let fs = Math.abs(flowAt(p.x, p.y));
    if (fs < settleThresh) {
      let s = 1 - fs / settleThresh;
      if (random() < settleProb * s * 6) addDeposit(p.x, p.y, DEPO_AMOUNT);
    } else if (fs > erodeThresh) {
      if (random() < erodeProb) addDeposit(p.x, p.y, -DEPO_AMOUNT);
    }

    let age = simTime - p.born;
    if (p.x < 0 || p.x > width || p.y < 0 || p.y > height || age > MAX_AGE) { particles.splice(i, 1); continue; }
  }
  while (particles.length < PARTICLE_COUNT) particles.push(spawnParticle());
}

function setup() {
  let c = createCanvas(windowWidth, windowHeight);
  c.parent('wrap');
  cellW = width / 60; cellH = height / 34;
  GW = max(1, floor(width / BED_CELL)); GH = max(1, floor(height / BED_CELL));
  userBedGrid = new Float32Array(GW*GH); depoGrid = new Float32Array(GW*GH);
  defaultBed();
  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(spawnParticle());
  document.getElementById('sAmp').oninput = e => tidalAmp = +e.target.value;
  document.getElementById('sPer').oninput = e => tidalPeriod = +e.target.value;
  document.getElementById('sAsy').oninput = e => asym = +e.target.value;
  document.getElementById('sSet').oninput = e => settleProb = +e.target.value;
  document.getElementById('sEro').oninput = e => erodeProb = +e.target.value;
  document.getElementById('bMorph').onclick = e => { showMorph = !showMorph; e.target.classList.toggle('on', showMorph); e.target.textContent = 'MORPHOLOGY — ' + (showMorph?'on':'off'); };
  document.getElementById('bFlow').onclick = e => { showFlow = !showFlow; e.target.classList.toggle('on', showFlow); e.target.textContent = 'FLOW — ' + (showFlow?'on':'off'); };
  document.getElementById('bReset').onclick = () => { simTime = 0; depoGrid.fill(0); defaultBed(); };
}

function paintBed(raise) {
  if (!mouseIsPressed) return;
  let gx = floor(mouseX / BED_CELL), gy = floor(mouseY / BED_CELL);
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    let nx = gx+dx, ny = gy+dy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    let r = Math.sqrt(dx*dx + dy*dy);
    if (r > 2.5) continue;
    let amt = (raise ? 6 : -6) * (1 - r/3);
    userBedGrid[nx + ny*GW] = constrain(userBedGrid[nx + ny*GW] + amt, 5, BED_MAX);
  }
}

function drawFlowArrows() {
  push(); stroke(122, 210, 245, 90); fill(122, 210, 245, 90); strokeWeight(1);
  let step = 12;
  for (let y = step; y < height; y += step) for (let x = step; x < width; x += step) {
    let vx = flowAt(x, y);
    let m = Math.abs(vx);
    if (m < 0.05) continue;
    let sx = Math.sign(vx);
    let L = constrain(m * 6, 2, step * 0.9);
    line(x, y, x + sx * L, y);
    triangle(x + sx*L, y, x + sx*L - sx*3, y - 3, x + sx*L - sx*3, y + 3);
  }
  pop();
}

function draw() {
  simTime += 1;
  updateParticles();
  paintBed(keyIsDown(SHIFT));

  background(11, 14, 20);

  // bed surface
  noStroke();
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    let z = userBedGrid[gx + gy*GW];
    let sh = map(z, 30, 140, 26, 74);
    fill(18, 26, 40 + sh * 0.35);
    rect(gx*BED_CELL, gy*BED_CELL, BED_CELL+1, BED_CELL+1);
  }

  // morphology (net accretion / erosion)
  if (showMorph) {
    noStroke();
    for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
      let d = depoGrid[gx + gy*GW];
      if (Math.abs(d) < 1.5) continue;
      let a = constrain(Math.abs(d) * 2.2, 0, 200);
      if (d > 0) fill(255, 209, 102, a); else fill(76, 180, 240, a);
      rect(gx*BED_CELL, gy*BED_CELL, BED_CELL, BED_CELL);
    }
  }

  if (showFlow) drawFlowArrows();

  // particles
  noStroke();
  for (let p of particles) {
    let spd = Math.abs(p.vx);
    let t = constrain(spd / 8.0, 0, 1);
    fill(255 - (255-70)*t, 68 + (180-68)*t, 170 + (230-170)*t, 200);
    circle(p.x, p.y, 2.5);
  }

  // tide gauge
  let et = etaLevel();
  push(); noStroke();
  let gx = 16, gy = height - 40, gw = 180, gh = 12;
  fill(40, 48, 62); rect(gx, gy, gw, gh);
  let mid = gx + gw/2;
  let bar = constrain(et / tidalAmp, -1, 1);
  if (bar >= 0) { fill(80, 160, 240); rect(mid, gy, bar*gw/2, gh); }
  else { fill(230, 90, 90); rect(mid + bar*gw/2, gy, -bar*gw/2, gh); }
  fill(255,255,255,60); rect(mid-1, gy, 2, gh);
  pop();

  // HUD
  let de = dEtaDt();
  let lbl = de > 0.02 ? 'FLOOD  →' : (de < -0.02 ? '←  EBB' : 'SLACK');
  let asymLbl = asym > 0.02 ? 'flood-dominant' : (asym < -0.02 ? 'ebb-dominant' : 'symmetric');
  document.getElementById('hud').innerHTML =
    't = ' + simTime + ' &nbsp; <span class="ph">' + lbl + '</span> &nbsp; ' + asymLbl + '<br>' +
    'flow = ' + (FLOW_SCALE * de).toFixed(1) + ' px/frame · particles = ' + particles.length;
  document.getElementById('vAmp').textContent = tidalAmp.toFixed(1);
  document.getElementById('vPer').textContent = tidalPeriod;
  document.getElementById('vAsy').textContent = asym.toFixed(2);
  document.getElementById('vSet').textContent = settleProb.toFixed(3);
  document.getElementById('vEro').textContent = erodeProb.toFixed(3);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  cellW = width / 60; cellH = height / 34;
  GW = max(1, floor(width / BED_CELL)); GH = max(1, floor(height / BED_CELL));
  userBedGrid = new Float32Array(GW*GH); depoGrid = new Float32Array(GW*GH);
  defaultBed();
}
</script>
</body>
</html>
